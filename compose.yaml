services:
  app:
    build: .
    networks:
      - default
      - traefik
    environment:
      DATABASE_URL: postgres://winerr:${POSTGRES_PASSWORD}@db:5432/winerr
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        # service_started (not service_healthy): the health-gate is only honored
        # by `docker compose up` and leaves the app stuck in "Created" under some
        # orchestrators (e.g. Komodo). The app tolerates the DB not being ready —
        # the Postgres connection is lazy and /login needs no DB — so ordering by
        # container start is enough.
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.winerr.entrypoints=websecure"
      - "traefik.http.routers.winerr.tls=true"
      - "traefik.http.routers.winerr.rule=Host(`winerr.limperiam.com`)"
      - "traefik.http.services.winerr.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: winerr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: winerr
    volumes:
      - winerr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winerr -d winerr"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-off reference-data seeder (does NOT run on normal `up` — it's behind a
  # profile). Uses the `builder` image stage, which has the source + tsx.
  # Run once after deploy:  docker compose --profile seed run --rm seed
  # (defaults to the free winemag dataset; pass a path/URL to override, e.g.
  #  docker compose --profile seed run --rm seed pnpm db:seed:winemag <url>)
  seed:
    build:
      context: .
      target: builder
    profiles:
      - seed
    command: ["pnpm", "db:seed:winemag"]
    environment:
      DATABASE_URL: postgres://winerr:${POSTGRES_PASSWORD}@db:5432/winerr
    depends_on:
      db:
        condition: service_started
    networks:
      - default
    restart: "no"

volumes:
  winerr_pgdata:

networks:
  default:
  traefik:
    external: true
